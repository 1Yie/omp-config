providers:
  opencode-go:
    modelOverrides:
      deepseek-v4-pro:
        reasoning: true
        thinking:
          mode: effort
          minLevel: high
          maxLevel: xhigh
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
