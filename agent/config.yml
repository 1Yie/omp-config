  - claude
  - claude-plugins
  - codex
  - agents
  - gemini
  - opencode
  - cline
  - mcp-json
enabledModels: 
  - deepseek/*
  - self-hosted-openai/*
  - deepseek-anthropic/*
  - nekocode-claude/*
  - nekocode-openai/*
  - opencode-go/*
  - cursor/*
